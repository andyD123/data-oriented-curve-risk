name: Cross-gamma focused checks
on:
  pull_request:
    paths:
      - 'ladder/cross_gamma.hpp'
      - 'tests/test_cross_gamma.cpp'
      - 'tests/test_cross_gamma_quantlib_archive.cpp'
      - 'examples/cross_gamma/**'
      - 'CMakeLists.txt'
      - '.github/workflows/cross-gamma.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable cross-gamma and reader example
        run: cmake -S . -B build-cross-gamma -DCMAKE_BUILD_TYPE=Release -DLADDER_LANES=PORTABLE -DLADDER_BUILD_EXAMPLES=ON -DLADDER_BUILD_QUANTLIB=OFF
      - name: Build targeted gamma and example executables
        run: cmake --build build-cross-gamma --target test_cross_gamma test_cross_gamma_quantlib_archive cross_gamma_example --parallel 2
      - name: Check fixed, QuantLib-archive, worked-example and offline algebra
        run: ctest --test-dir build-cross-gamma --output-on-failure -R '^cross_gamma'
  full-repository:
    name: Full existing suite (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [PORTABLE, AVX2]
    steps:
      - uses: actions/checkout@v4
      - name: Configure full repository (skip optional QuantLib/paper benchmarks)
        run: >
          cmake -S . -B build-full -DCMAKE_BUILD_TYPE=Release
          -DLADDER_LANES=${{ matrix.backend }}
          -DLADDER_BUILD_EXAMPLES=ON
          -DLADDER_BUILD_QUANTLIB=OFF
          -DLADDER_BUILD_PAPER_BENCHMARKS=OFF
          -DLADDER_BUILD_WIDE_GROUP_EXPERIMENT=OFF
      - name: Build every standard test and example
        run: cmake --build build-full --parallel 2
      - name: Run complete CTest suite, including existing risk regressions
        run: ctest --test-dir build-full --output-on-failure --parallel 2
