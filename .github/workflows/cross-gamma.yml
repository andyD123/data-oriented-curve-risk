name: Cross-gamma focused checks
on:
  pull_request:
    paths:
      - 'ladder/cross_gamma.hpp'
      - 'tests/test_cross_gamma.cpp'
      - 'tests/test_cross_gamma_quantlib_archive.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/cross-gamma.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable library without heavy examples
        run: cmake -S . -B build-cross-gamma -DCMAKE_BUILD_TYPE=Release -DLADDER_LANES=PORTABLE -DLADDER_BUILD_EXAMPLES=OFF
      - name: Build fast mathematical and archived QuantLib regressions
        run: cmake --build build-cross-gamma --target test_cross_gamma test_cross_gamma_quantlib_archive --parallel 2
      - name: Run focused tests
        run: ctest --test-dir build-cross-gamma --output-on-failure -R '^cross_gamma'
